<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Sign in — Steady Leads</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700&display=swap">
<style>
:root{--bg:#f3f4f7;--card:#fff;--label:#1c1c1e;--label2:#636369;--sep:rgba(60,60,67,.18);--tint:#2f5bd9;--red:#d3261a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f13;--card:#1c1c1e;--label:#fff;--label2:#a4a4ab;--sep:rgba(84,84,88,.6);--tint:#3b9bff;--red:#ff5c50}}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--label);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
form{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;text-align:center}
.mark{margin-bottom:20px}.mark svg{display:block}
h1{font:700 32px/1.1 'Barlow Semi Condensed','Avenir Next Condensed','Arial Narrow',sans-serif}
p{color:var(--label2);font-size:15px;margin:6px 0 24px;text-wrap:balance}
.group{width:100%;background:var(--card);border-radius:12px;overflow:hidden;text-align:left}
label{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px}
label+label{border-top:.5px solid var(--sep)}
label span{width:84px;flex:none}
input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:inherit;height:48px}
label:focus-within span{color:var(--tint)}
#err{color:var(--red);font-size:14px;min-height:20px;margin:10px 0}
button{width:100%;height:50px;border:0;border-radius:12px;background:var(--tint);color:#fff;font:600 17px/1 inherit;font-family:inherit;cursor:pointer}
button:active{opacity:.85}button:disabled{opacity:.5}
</style></head><body>
<form id="f">
  <div class="mark"><svg viewBox="0 0 32 32" aria-hidden="true" width="64" height="64"><rect width="32" height="32" rx="8" fill="#171a22"/><rect x="5" y="11" width="22" height="10" rx="5" fill="none" stroke="#c5ee3a" stroke-width="2"/><path d="M12 11.500v9M20 11.500v9" stroke="#c5ee3a" stroke-width="1.500"/><circle cx="16" cy="16" r="2.600" fill="#c5ee3a"/></svg></div>
  <h1>Steady Leads</h1><p>Sign in with the account your admin set up for you.</p>
  <div class="group">
    <label><span>Email</span><input id="e" type="email" autocomplete="username" required autofocus placeholder="you@company.com"></label>
    <label><span>Password</span><input id="p" type="password" autocomplete="current-password" required placeholder="Required"></label>
  </div>
  <div id="err" role="alert"></div><button id="b">Sign In</button>
</form>
<script>
const $=i=>document.getElementById(i);
$('f').onsubmit=async ev=>{ev.preventDefault();$('b').disabled=true;$('err').textContent='';
  try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('e').value,password:$('p').value})});
    if(r.ok)return location.href='/';$('err').textContent=(await r.json().catch(()=>({}))).error||'Sign in failed'}
  catch(e){$('err').textContent='Cannot reach the server. Check your connection.'}
  $('b').disabled=false};
</script></body></html>
